<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level Editor</title>
    <style>

        body {
            margin: 0;
            padding: 10px;
            font-family: Arial, sans-serif;
            background: #202020;
            color: #f0f0f0;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 200px 1fr 250px;
            gap: 15px;
            height: 100vh;
        }
        .panel {

            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            overflow: auto;
        }
        .leftpanel {

            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            overflow: auto;width: 400px;         /* fixed width */
            min-width: 400px;     /* prevent shrinking */
            max-width: 400px;     /* prevent growing */
            padding: 12px;
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;     /* or auto if you want scrollbars */
            display: flex;
            flex-direction: column;
            gap: 10px;            /* spacing between controls */

        }
        .panel select,
        .panel button {
            padding: 6px 10px;
            font-size: 0.95rem;
            border-radius: 4px;
            flex-shrink: 0;       /* prevents shrinking */
            width: 100%;          /* fills panel width */
            max-width: 100%;

        }


        .panel h3 {
            margin-top: 0;
            font-size: 1rem;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        input[type="number"], select, button, input[type="file"] {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
        }
        .leftpanel select,
        .leftpanel button {
            width: 100%;
            max-width: 100%;
        }

        .palette-groups {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .palette-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .palette-group h4 {
            margin: 0;
            color: #ddd;
            font-size: 0.9rem;
        }
        .palette-group img {
            max-width: 48px;
            max-height: 48px;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 4px;
            background-color: transparent;
        }
        .palette-group img.selected {
            border-color: red;
        }
        button:hover { background: #666; }
        .drag-control { display: flex; align-items: center; gap: 5px; }
        .drag-control input[type="range"] { flex: 1; }

        /* Center viewport sizing fix */
        #viewportdiv { display: flex; flex-direction: column; }
        #viewport {
            background: #111;
            border: 1px solid #333;
            flex: 1;               /* fills the panel height */
            position: relative;
            overflow: hidden;
            min-height: 200px;
        }
        #paletteDisplay img {
            width: 90px;
            height: 90px;
            object-fit: contain; /* keeps aspect ratio inside the box */
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            background-color: transparent;
        }

        /* Highlight selected palette item */
        #paletteDisplay img.selected {
            border-color: red;
        }
        canvas { display: block; }
    </style>
</head>
<body>
<div class="grid-container">
    <!-- Left tools -->
    <div class="leftpanel">
        <h3>Tools</h3>
        <button id="toggleCam">Switch Camera</button>
        <button id="spriteModeBtn">Mode: Decal</button>

        <label for="modelSelector">Sprite Asset</label>
        <select id="modelSelector">

        </select>

        <button id="savebutton">Save Level</button>
        <input type="file" id="loadInput" accept=".json" style="display:none;">
        <button id="loadbutton">Load Level</button>

        <h3>Sprite Preview</h3>
        <img id="spritePreview" src="assets/spaceship.png" alt="Preview" style="max-width:150px;max-height:150px;">
        <hr style="border:1px solid #444; margin:10px 0;">

        <div id="paletteButtons">
            <button id="addToPaletteBtn">➕ Add to Palette</button>
            <button id="savePaletteBtn">💾 Save Palette</button>
            <button id="loadPaletteBtn">📂 Load Palette</button>
        </div>

        <!-- Optional: a list to display saved palette items -->
        <div id="paletteDisplay" class="palette-display"></div>
    </div>

    <!-- Center viewport -->
    <div id="viewportdiv" class="panel">
        <h3>Viewport</h3>
        <div id="viewport"></div>
        <!-- Just your editor JS; it imports Three from CDN -->
        <script type="module" src="./levelEditor2.js"></script>
    </div>

    <!-- Right context menu -->
    <div id="contextMenu" class="panel">
        <h3>Context Menu</h3>

        <label for="spriteName">Name</label>
        <input type="text" id="spriteName" placeholder="Enter name">

        <label>Position X</label>
        <div class="drag-control">
            <input type="number" id="posX" step="0.01" placeholder="X">
            <input type="range" id="sliderX" min="-100" max="100" step="0.01">
        </div>

        <label>Position Y</label>
        <div class="drag-control">
            <input type="number" id="posY" step="0.01" placeholder="Y">
            <input type="range" id="sliderY" min="-100" max="100" step="0.01">
        </div>

        <label>Position Z</label>
        <div class="drag-control">
            <input type="number" id="posZ" step="0.01" placeholder="Z">
            <input type="range" id="sliderZ" min="-100" max="100" step="0.01">
        </div>

        <label for="entityType">Entity Type</label>
        <select id="entityType">
            <option value="billboard">Billboard</option>
            <option value="npc">NPC</option>
            <option value="skill">Skill</option>
            <option value="drop">Drop</option>
        </select>

        <button id="updateBtn">Update</button>
    </div>
</div>

<script>
    // Keep the preview in sync with the selector
    const modelSelector = document.getElementById('modelSelector');
    const spritePreview = document.getElementById('spritePreview');
    spritePreview.src = modelSelector.value;
    modelSelector.addEventListener('change', () => {
        spritePreview.src = "sprites/"+modelSelector.value;
    });
</script>
<script type="module" src="./loader.js"></script>
</body>
</html>
