<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TransformControls Demo (Single File)</title>
    <style>
        html, body { margin:0; height:100%; background:#111; }
        #log { position:fixed; top:8px; left:8px; padding:6px 8px; background:#222; color:#0f0; font:12px/1.3 monospace; z-index:10; }
    </style>
</head>
<body>
<div id="log">loading…</div>
<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { TransformControls } from 'three/examples/jsm/controls/TransformControls.js';

    const log = (msg) => document.getElementById('log').textContent = msg;

    // Quick sanity: show versions and instanceof results
    const canvasContainer = document.body;

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202028);

    // Camera
    const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
    camera.position.set(3, 2, 6);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x202028, 1);
    canvasContainer.appendChild(renderer.domElement);

    // Controls
    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;

    // Lights
    scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.0));
    const dir = new THREE.DirectionalLight(0xffffff, 0.7);
    dir.position.set(5, 10, 7);
    scene.add(dir);

    // Helpers to be sure something shows
    scene.add(new THREE.AxesHelper(2));
    const grid = new THREE.GridHelper(20, 20);
    scene.add(grid);

    // Cube
    const cube = new THREE.Mesh(
        new THREE.BoxGeometry(1,1,1),
        new THREE.MeshStandardMaterial({ color: 0x4fc3f7, metalness: 0.1, roughness: 0.7 })
    );
    cube.position.y = 0.5;
    scene.add(cube);

    // TransformControls
    const transform = new TransformControls(camera, renderer.domElement);
    scene.add(transform);               // add ONCE to the scene
    transform.attach(cube);             // attach to cube
    transform.setMode('translate');     // start in translate
    transform.addEventListener('dragging-changed', e => {
        orbit.enabled = !e.value;
    });

    import * as THREE from 'three';
    import { OrbitControls }     from 'three/examples/jsm/controls/OrbitControls.js';
    import { TransformControls } from 'three/examples/jsm/controls/TransformControls.js';

    console.log('[where am I loading from?]');
    console.log(' three      import url =', new URL(import.meta.url).href);
    console.log(' OrbitCtrl  module url =', import.meta.resolve
        ? await import.meta.resolve('three/examples/jsm/controls/OrbitControls.js')
        : 'no import.meta.resolve');
    console.log(' Transform  module url =', import.meta.resolve
        ? await import.meta.resolve('three/examples/jsm/controls/TransformControls.js')
        : 'no import.meta.resolve');

    const transform = new TransformControls(camera, renderer.domElement);
    console.log('THREE.REVISION =', THREE.REVISION);
    console.log('transform instanceof THREE.Object3D =', transform instanceof THREE.Object3D);


    // Log sanity
    log(`THREE.REVISION=${THREE.REVISION}  tc instanceof Object3D=${transform instanceof THREE.Object3D}`);

    // Resize
    addEventListener('resize', () => {
        camera.aspect = innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });

    // Animate
    (function animate(){
        requestAnimationFrame(animate);
        orbit.update();
        renderer.render(scene, camera);
    })();

    // Keyboard quick modes
    addEventListener('keydown', (e) => {
        if (e.key === 'g') transform.setMode('translate');
        if (e.key === 'r') transform.setMode('rotate');
        if (e.key === 's') transform.setMode('scale');
    });
</script>
</body>
</html>
